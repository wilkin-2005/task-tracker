<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Wilmer Kindstedt">

    <title>Task-Tracker</title>
    <script type="module" src="./dist/main.js"> </script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Task-Tracker</h1>
    </header>

    <form id="task-form" aria-labelledby="form-header">
        <h2 id="form-header">Lägg till en ny uppgift</h2>

        <div class="form-group">
            <label class="form-label" for="task-name">Lägg till namn</label>
            <input id="task-name" name="name" type="text" placeholder="Ny uppgift namn" minlength="3" maxlength="40" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="priority-input">Välj prioritet</label>
            <select id="priority-input" name="priority" required>
                <option value="" disabled selected>Välj prioritet</option>
                <option value="låg">Låg</option>
                <option value="medel">Medel</option>
                <option value="hög">Hög</option>
            </select>
        </div>

        <!-- <div class="form-group">
            <label class="form-label" for="description-input">Skriv en beskrivning</label>
            <textarea id="description-input" name="description" rows="3" maxlength="1000" placeholder="Beskrivning av uppgift..."></textarea>
        </div> -->
        
        <button type="submit">Lägg till uppgift</button>

        <p id="error-message"></p>
    </form>

    <section id="app" aria-label="Alla uppgifter"></section>
    
    <section id="info--delete" aria-label="Information om och radera alla uppgifter">
        <span id="task-counter">Totalt antal uppgifter:</span>
        <span id="last-saved">Senast sparad:</span>
        <button type="button" id="clear-button">Radera alla uppgifter</button>
    </section>
</body>
</html>
